- url: https://astro-art-portfolio.netlify.app/
  output: screenshots/home-light.png
  width: 1440
  height: 900
  wait: 1000
  javascript: |
    localStorage.setItem('theme', 'light');
    document.documentElement.classList.add('light');
    document.documentElement.classList.remove('dark');

